version: '3.8'

services:
  streamlit-app:
    build: .
    container_name: hr_retention_streamlit
    ports:
      - "8501:8501"
    command: streamlit run app/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    restart: always

  fastapi-service:
    build: .
    container_name: hr_retention_api
    ports:
      - "8000:8000"
    command: uvicorn app.main_api:app --host 0.0.0.0 --port 8000
    restart: always
